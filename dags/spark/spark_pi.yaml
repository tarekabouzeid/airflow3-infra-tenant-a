# SparkApplication template rendered by SparkKubernetesOperator (Jinja-templated via the
# params dict below). Never write a literal double-brace expression in a plain comment
# anywhere in this file, including this one: Jinja scans the whole raw text for its
# delimiters regardless of YAML syntax, so it would fail to compile the whole file on it.
# Deliberately tiny: 1 driver + 1 executor, 512Mi each.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: it-spark-pi-{{ params.suffix }}-{{ ts_nodash | lower }}
  namespace: {{ params.namespace }}
spec:
  type: Scala
  mode: cluster
  image: apache/spark:3.5.3
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples_2.12-3.5.3.jar
  sparkVersion: "3.5.3"
  restartPolicy:
    type: Never
  driver:
    serviceAccount: {{ params.service_account }}
    cores: 1
    memory: 512m
  executor:
    instances: 1
    cores: 1
    memory: 512m
